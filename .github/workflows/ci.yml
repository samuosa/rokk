name: CI

on:
  pull_request:
    paths:
      - "project/vue/**"
      - ".github/workflows/ci.yml"
  push:
    branches-ignore: [main]
    paths:
      - "project/vue/**"
      - ".github/workflows/ci.yml"

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/vue
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project/vue/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (SSG)
        run: npm run build
        env:
          VITE_SITE_URL: https://rokk.xyz
