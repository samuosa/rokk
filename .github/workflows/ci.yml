name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, develop]

jobs:
  typecheck-and-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # See deploy-pages.yml — npm 10.9's resolver crashes without this.
      - run: npm ci --legacy-peer-deps

      - run: npm run typecheck

      # Builds the production shape (base "/"), so a branch that breaks
      # prerendering fails here rather than on a deploy.
      - name: Generate (prerender)
        run: npx nuxt generate
        env:
          NUXT_SITE_URL: https://rokk-fm.de

      - name: Verify prerendered HTML contains real content
        run: |
          grep -q "COLLISION OF SUBCULTURES" .output/public/index.html \
            || { echo "::error::index.html has no prerendered content"; exit 1; }
