name: Deploy to GitHub Pages (test)

on:
  push:
    branches: [main]
    paths:
      - "project/vue/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/vue
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project/vue/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Runs BEFORE the build so the build can read where Pages will actually
      # serve this site from. enablement: true additionally lets the workflow
      # create the Pages site and point it at GitHub Actions (via the
      # pages: write permission above), so a fresh repo deploys without anyone
      # flipping Settings -> Pages -> Source by hand; no-op once configured.
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      # Both values come from the live Pages configuration rather than from the
      # repo name, so this stays correct for a project site AND for a custom
      # domain, which serves from the domain root:
      #   project site    base_path "/rokk"   origin "https://samuosa.github.io"
      #   custom domain   base_path ""        origin "https://rokk.music"
      # base_path never carries a trailing slash (and is empty at a domain
      # root), so the "/" below turns it into the "/rokk/" or "/" that Vite's
      # `base` wants. origin is the bare origin canonicalUrl() expects — it
      # appends VITE_BASE_PATH itself, so putting the sub-path in both would
      # duplicate it into ".../rokk/rokk/...". The Ionos production build sets
      # these by hand instead (see project/vue/README.md).
      - name: Build (SSG)
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SITE_URL: ${{ steps.pages.outputs.origin }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: project/vue/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
