name: Deploy to GitHub Pages (test)

on:
  push:
    branches: [main]
    paths:
      - "project/vue/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/vue
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: project/vue/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # GitHub Pages project sites are served from https://<owner>.github.io/<repo>/.
      # VITE_SITE_URL is the bare origin (no repo path — canonicalUrl() appends
      # VITE_BASE_PATH on top of it, so putting the repo name in both would
      # duplicate it into ".../rokk/rokk/..."). Both are derived from the repo
      # itself, no hardcoding needed. The Ionos production build instead uses
      # VITE_BASE_PATH=/ with the real domain (see project/vue/README.md).
      - name: Build (SSG)
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io

      # enablement: true lets this workflow create/point the repo's Pages site at
      # GitHub Actions itself (via the pages: write permission above), so a fresh
      # repo deploys without anyone first flipping Settings -> Pages -> Source.
      # It is a no-op once Pages is already configured that way.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: project/vue/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
